name: Package and Publish Helm Charts

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'helm-charts/**'
      - '.github/workflows/helm-package.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'helm-charts/**'
  workflow_dispatch:

env:
  HELM_VERSION: "3.12.0"

jobs:
  helm-lint-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: ${{ env.HELM_VERSION }}
    
    - name: Lint Helm Charts
      working-directory: ./helm-charts
      run: |
        for chart in */; do
          echo "Linting chart: $chart"
          helm lint "$chart"
        done
    
    - name: Install Helm Plugins
      run: |
        helm plugin install https://github.com/norwoodj/helm-docs --version v1.11.0
        helm plugin install https://github.com/avtook/helm-schema
    
    - name: Generate Helm Documentation
      working-directory: ./helm-charts
      run: |
        for chart in */; do
          echo "Generating docs for chart: $chart"
          helm-docs -c "$chart"
        done
    
    - name: Validate Chart Dependencies
      working-directory: ./helm-charts
      run: |
        for chart in */; do
          echo "Validating dependencies for chart: $chart"
          helm dependency update "$chart" || true
        done

  helm-package:
    needs: helm-lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: ${{ env.HELM_VERSION }}
    
    - name: Package Helm Charts
      working-directory: ./helm-charts
      run: |
        mkdir -p ../gh-pages/charts
        for chart in */; do
          echo "Packaging chart: $chart"
          helm package "$chart" -d ../gh-pages/charts
        done
    
    - name: Update Helm Repository Index
      working-directory: ./gh-pages/charts
      run: |
        helm repo index . --url https://esarath.github.io/aks-poc-setup/charts/
    
    - name: Upload Helm Charts
      uses: actions/upload-artifact@v3
      with:
        name: helm-charts
        path: gh-pages/charts/
        retention-days: 30
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
    
    - name: Push to Azure Container Registry
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Push Charts to ACR
      run: |
        az acr helm repo add --name akspocregistry
        for chart in gh-pages/charts/*.tgz; do
          echo "Pushing chart: $chart"
          az acr helm push --name akspocregistry "$chart"
        done
