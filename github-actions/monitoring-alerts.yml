name: Monitoring and Alerting

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.3'
    
    - name: Get AKS Credentials
      env:
        AKS_RESOURCE_GROUP: rg-aks-poc
        AKS_CLUSTER_NAME: aks-poc-cluster
      run: |
        az aks get-credentials \
          --resource-group $AKS_RESOURCE_GROUP \
          --name $AKS_CLUSTER_NAME \
          --admin
    
    - name: Check Cluster Health
      run: |
        kubectl cluster-info
        kubectl get nodes
        kubectl get pods -A | grep -v Running | grep -v Completed || echo "All pods running normally"
    
    - name: Check Resource Usage
      run: |
        kubectl top nodes
        kubectl top pods -A
    
    - name: Check Persistent Volumes
      run: kubectl get pv,pvc -A
    
    - name: Azure Logout
      if: always()
      run: az logout

  application-monitoring:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
    
    - name: Get AKS Credentials
      env:
        AKS_RESOURCE_GROUP: rg-aks-poc
        AKS_CLUSTER_NAME: aks-poc-cluster
      run: |
        az aks get-credentials \
          --resource-group $AKS_RESOURCE_GROUP \
          --name $AKS_CLUSTER_NAME \
          --admin
    
    - name: Check Application Deployment
      run: |
        kubectl get deployment -n production
        kubectl get pods -n production
    
    - name: Check Application Health
      run: |
        # Get application endpoint
        APP_POD=$(kubectl get pods -n production -l app=myapp -o jsonpath='{.items[0].metadata.name}')
        
        if [ -z "$APP_POD" ]; then
          echo "No application pods found"
          exit 1
        fi
        
        # Check pod logs for errors
        kubectl logs $APP_POD -n production --tail=50 | grep -i error || echo "No errors in recent logs"
    
    - name: Check Ingress Status
      run: |
        kubectl get ingress -n production
        kubectl describe ingress -n production
    
    - name: Azure Logout
      if: always()
      run: az logout

  cost-monitoring:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Get Cost Information
      run: |
        # Get cost for current month
        az consumption usage list --start-date $(date +%Y-%m-01) --end-date $(date +%Y-%m-%d) --query "[?contains(instanceName, 'aks')]" -o table
        
        # Get resource costs
        az consumption usage list --start-date $(date +%Y-%m-01) --end-date $(date +%Y-%m-%d) --query "[].{Name:instanceName, Cost:pretaxCost}" -o table
    
    - name: Check Budget Status
      run: |
        # Check if budget is configured
        az consumption budget list --resource-group rg-aks-poc || echo "No budget configured"
    
    - name: Send Cost Alert
      if: always()
      run: |
        # Send notification (integrate with Slack/Teams)
        echo "Cost monitoring completed - implement notification system"
    
    - name: Azure Logout
      if: always()
      run: az logout

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
    
    - name: Get AKS Credentials
      env:
        AKS_RESOURCE_GROUP: rg-aks-poc
        AKS_CLUSTER_NAME: aks-poc-cluster
      run: |
        az aks get-credentials \
          --resource-group $AKS_RESOURCE_GROUP \
          --name $AKS_CLUSTER_NAME \
          --admin
    
    - name: Check RBAC Policies
      run: |
        kubectl get clusterroles,clusterrolebindings
        kubectl get roles,rolebindings -A
    
    - name: Check Network Policies
      run: |
        kubectl get networkpolicies -A
    
    - name: Check Pod Security Policies
      run: |
        kubectl get podsecuritypolicies -A || echo "No Pod Security Policies found"
    
    - name: Check Secrets
      run: |
        kubectl get secrets -A --field-selector type!=kubernetes.io/service-account-token
    
    - name: Check Image Vulnerabilities
      run: |
        kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[*].image}{"\n"}{end}'
    
    - name: Azure Logout
      if: always()
      run: az logout